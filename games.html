<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲーム一覧 - KENI's Home</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
            --text-main: #2d2b2a;
            --text-sub: #6e6a66;
            --accent-warm: #e06d53;
            --accent-purple: #7b68ee;
            --border-color: #eee9e0;
            --shadow-soft: 0 10px 30px rgba(180, 160, 140, 0.12);
            --shadow-hover: 0 15px 35px rgba(180, 160, 140, 0.22);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Zen Maru Gothic', 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            background: rgba(253, 251, 247, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--border-color);
        }

        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 900;
            font-size: 1.25rem;
            color: var(--accent-warm);
            text-decoration: none;
        }

        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
        }
        .nav-links a:hover { background: #f3ede2; color: var(--accent-warm); }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 120px 24px 60px 24px;
        }

        .page-header {
            margin-bottom: 40px;
        }

        .page-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-desc {
            color: var(--text-sub);
            font-size: 1rem;
        }

        /* ゲームカード一覧 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .game-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-soft);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent-warm);
        }

        .game-img-box {
            width: 100%;
            height: 170px;
            background: #f3ede2;
            overflow: hidden;
            position: relative;
        }

        .game-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .game-card:hover .game-img-box img {
            transform: scale(1.05);
        }

        .game-info {
            padding: 24px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .game-title {
            font-size: 1.25rem;
            font-weight: 900;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .game-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 16px;
            flex-grow: 1;
        }

        .game-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }

        .game-tag {
            background: #f3ede2;
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .game-play-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            font-weight: 900;
            color: var(--accent-warm);
        }

        .loading-text, .error-text {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
        }

        footer {
            text-align: center;
            padding: 40px 24px;
            color: var(--text-sub);
            border-top: 2px solid var(--border-color);
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo"><span>☕</span> KENI'S ROOM</a>
            <ul class="nav-links">
                <li><a href="https://keni-77.github.io">トップ</a></li>
                <li><a href="https://keni-77.github.io/games.html" style="color: var(--accent-warm);">ゲーム一覧</a></li>
                <li><a href="https://keni-77.github.io/bots.html">Discord Bot一覧</a></li>
            </ul>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h1 class="page-title">🎮 ゲーム一覧</h1>
            <p class="page-desc">ブラウザで今すぐ遊べる自作ゲームたちです。PCでもスマホでもプレイできます！</p>
        </div>

        <div id="gameGrid" class="game-grid">
            <div class="loading-text">ゲームを読み込んでいます...</div>
        </div>
    </main>

    <footer>
        <p>© 2026 KENI - Thanks for visiting!</p>
    </footer>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('games.json')
            .then(res => {
                if (!res.ok) throw new Error('読み込み失敗');
                return res.json();
            })
            .then(games => {
                const container = document.getElementById('gameGrid');
                container.innerHTML = '';

                if (games.length === 0) {
                    container.innerHTML = '<div class="loading-text">まだゲームが登録されていません。</div>';
                    return;
                }

                games.forEach(game => {
                    const card = document.createElement('a');
                    card.className = 'game-card';
                    card.href = game.url;
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';

                    const tagsHtml = game.tags ? game.tags.map(t => `<span class="game-tag">${t}</span>`).join('') : '';

                    card.innerHTML = `
                        <div class="game-img-box">
                            <img src="${game.image}" alt="${game.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/500x300/f3ede2/e06d53?text=No+Image'">
                        </div>
                        <div class="game-info">
                            <div class="game-title">${game.title}</div>
                            <div class="game-desc">${game.description}</div>
                            ${tagsHtml ? `<div class="game-tags">${tagsHtml}</div>` : ''}
                            <div class="game-play-btn">遊んでみる ➔</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('gameGrid').innerHTML = `
                    <div class="error-text">
                        <p>ゲームデータの読み込みに失敗しました。</p>
                        <p style="font-size: 0.85rem; margin-top: 6px;"><code>games.json</code> ファイルが同じフォルダ内にあるか確認してください。</p>
                    </div>
                `;
            });
    });
</script>
</body>
</html>
