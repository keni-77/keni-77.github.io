<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot一覧 - KENI's Home</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
            --text-main: #2d2b2a;
            --text-sub: #6e6a66;
            --accent-warm: #e06d53;
            --accent-purple: #7b68ee;
            --border-color: #eee9e0;
            --shadow-soft: 0 10px 30px rgba(180, 160, 140, 0.12);
            --shadow-hover: 0 15px 35px rgba(180, 160, 140, 0.22);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Zen Maru Gothic', 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            background: rgba(253, 251, 247, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--border-color);
        }

        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 900;
            font-size: 1.25rem;
            color: var(--accent-warm);
            text-decoration: none;
        }

        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
        }
        .nav-links a:hover { background: #f3ede2; color: var(--accent-warm); }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 120px 24px 60px 24px;
        }

        .page-header {
            margin-bottom: 40px;
        }

        .page-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-desc {
            color: var(--text-sub);
            font-size: 1rem;
        }

        /* Botカード一覧 */
        .bot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .bot-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 28px;
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .bot-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent-purple);
        }

        .bot-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .bot-icon {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            object-fit: cover;
            border: 2px solid var(--border-color);
            background: #f3ede2;
        }

        .bot-name {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--text-main);
        }

        .bot-desc {
            font-size: 0.92rem;
            color: var(--text-sub);
            margin-bottom: 20px;
            flex-grow: 1;
            line-height: 1.6;
        }

        .bot-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
        }

        .bot-tag {
            background: #f3ede2;
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .bot-btn-group {
            display: flex;
            gap: 10px;
        }

        .bot-btn {
            flex: 1;
            text-align: center;
            padding: 10px 16px;
            border-radius: 14px;
            font-weight: 900;
            font-size: 0.88rem;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-invite {
            background: var(--accent-purple);
            color: white;
        }
        .btn-invite:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-detail {
            background: #fcfbf7;
            color: var(--text-main);
            border: 2px solid var(--border-color);
        }
        .btn-detail:hover {
            background: #f3ede2;
        }

        .loading-text, .error-text {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
        }

        footer {
            text-align: center;
            padding: 40px 24px;
            color: var(--text-sub);
            border-top: 2px solid var(--border-color);
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo"><span>☕</span> KENI'S ROOM</a>
            <ul class="nav-links">
                <li><a href="index.html">トップ</a></li>
                <li><a href="games.html">ゲーム一覧</a></li>
                <li><a href="bots.html" style="color: var(--accent-purple);">Discord Bot一覧</a></li>
            </ul>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h1 class="page-title">🤖 Discord Bot一覧</h1>
            <p class="page-desc">Discordサーバーを便利にしたり、会話を楽しく盛り上げる自作Botたちです。</p>
        </div>

        <div id="botGrid" class="bot-grid">
            <div class="loading-text">Botデータを読み込んでいます...</div>
        </div>
    </main>

    <footer>
        <p>© 2026 KENI - Thanks for visiting!</p>
    </footer>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('bots.json')
            .then(res => {
                if (!res.ok) throw new Error('読み込み失敗');
                return res.json();
            })
            .then(bots => {
                const container = document.getElementById('botGrid');
                container.innerHTML = '';

                if (bots.length === 0) {
                    container.innerHTML = '<div class="loading-text">まだBotが登録されていません。</div>';
                    return;
                }

                bots.forEach(bot => {
                    const card = document.createElement('div');
                    card.className = 'bot-card';

                    const tagsHtml = bot.tags ? bot.tags.map(t => `<span class="bot-tag">${t}</span>`).join('') : '';

                    card.innerHTML = `
                        <div class="bot-header">
                            <img class="bot-icon" src="${bot.icon}" alt="${bot.name}" onerror="this.src='https://via.placeholder.com/64/f3ede2/7b68ee?text=Bot'">
                            <div class="bot-name">${bot.name}</div>
                        </div>
                        <div class="bot-desc">${bot.description}</div>
                        <div class="bot-tags">${tagsHtml}</div>
                        <div class="bot-btn-group">
                            ${bot.inviteUrl ? `<a href="${bot.inviteUrl}" target="_blank" rel="noopener noreferrer" class="bot-btn btn-invite">サーバーに追加</a>` : ''}
                            ${bot.githubUrl ? `<a href="${bot.githubUrl}" target="_blank" rel="noopener noreferrer" class="bot-btn btn-detail">GitHub</a>` : ''}
                        </div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('botGrid').innerHTML = `
                    <div class="error-text">
                        <p>Botデータの読み込みに失敗しました。</p>
                        <p style="font-size: 0.85rem; margin-top: 6px;"><code>bots.json</code> ファイルが同じフォルダ内にあるか確認してください。</p>
                    </div>
                `;
            });
    });
</script>
</body>
</html>
